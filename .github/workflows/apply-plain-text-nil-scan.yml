name: Apply plain-text nil scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        shell: bash
        run: |
          base64 -d .github/nil-plain-text.patch.gz.b64 | gzip -d > /tmp/nil-plain-text.patch
          git apply --check /tmp/nil-plain-text.patch
          git apply /tmp/nil-plain-text.patch
          rm -f .github/nil-plain-text.patch.gz.b64 .github/workflows/apply-plain-text-nil-scan.yml
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace nil scan JSON with live text list"
          git push
