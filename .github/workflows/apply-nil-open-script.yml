name: Apply nil script inspector patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        shell: bash
        run: |
          git apply --check .github/nil-open-script.patch
          git apply .github/nil-open-script.patch
          rm -f .github/nil-open-script.patch .github/workflows/apply-nil-open-script.yml
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make nil scripts openable in source viewer"
          git push origin HEAD:main
