name: Apply streamed nil scan fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        shell: bash
        run: |
          base64 -d .github/stream-nil-scan.patch.gz.b64 | gzip -d > /tmp/stream-nil-scan.patch
          git apply /tmp/stream-nil-scan.patch
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          rm -f .github/stream-nil-scan.patch.gz.b64 .github/workflows/apply-stream-nil-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stream nil-instance dashboard scans in batches"
          git push
