name: Build and release Android v0.5.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: pwsh
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Install bridge dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }

      - name: Prepare embedded Android runtime
        shell: pwsh
        run: |
          ./android-manager/scripts/prepare-embedded-runtime.ps1

      - name: Build Android manager
        shell: pwsh
        run: |
          Push-Location android-manager
          try {
            ./gradlew.bat packageManagerDebug --stacktrace
            if ($LASTEXITCODE -ne 0) { throw "Gradle failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Verify APK
        id: apk
        shell: pwsh
        run: |
          $apk = Join-Path $PWD "android-manager/app/build/distributions/RobloxMcpManager-Android-v0.5.0.apk"
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) { throw "Expected APK was not produced: $apk" }
          $size = (Get-Item -LiteralPath $apk).Length
          $sha = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "APK: $apk"
          Write-Host "Size: $size bytes"
          Write-Host "SHA-256: $sha"
          "path=$apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Replace Android APK on v2.4.7 release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        shell: pwsh
        run: |
          gh release delete-asset v2.4.7 "RobloxMcpManager-Android-v0.4.9.apk" --yes 2>$null
          gh release upload v2.4.7 "$env:APK_PATH#RobloxMcpManager-Android-v0.5.0.apk" --clobber
          $notes = @"
Highlights

- Fixed ChatGPT `/mnt/data` file imports in the Android manager by staging transferred files inside the app's writable private cache.
- Added a GPT Files section for viewing cached ChatGPT files.
- Added per-file Download and Delete controls, plus Refresh and Delete all.
- Keeps Android storage isolation intact instead of exposing arbitrary filesystem access.
- APK downloads and manager updates remain SHA-256 verified.

Android manager: v0.5.0 (ARM64, Android 8.0+)
Windows manager: v2.4.7
MCP runtime: v2.4.7

Android APK SHA-256: $env:APK_SHA256
"@
          gh release edit v2.4.7 --title "Roblox MCP Bridge v2.4.7" --notes $notes
