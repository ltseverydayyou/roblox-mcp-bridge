name: Build Android v0.5.0

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-release-android-v050.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        shell: pwsh
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Prepare embedded runtime
        shell: pwsh
        run: ./android-manager/scripts/prepare-embedded-runtime.ps1
      - name: Build APK
        shell: pwsh
        run: |
          Set-Location android-manager
          ./gradlew.bat packageManagerDebug --stacktrace
      - name: Upload APK to v2.4.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = "android-manager/app/build/distributions/RobloxMcpManager-Android-v0.5.0.apk"
          if (-not (Test-Path $apk)) { throw "APK missing: $apk" }
          gh release delete-asset v2.4.7 RobloxMcpManager-Android-v0.4.9.apk --yes 2>$null
          gh release upload v2.4.7 $apk --clobber
