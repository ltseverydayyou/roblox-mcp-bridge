name: Apply Android GPT files patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/android-gpt-files.patch
          git apply --check /tmp/android-gpt-files.patch
          git apply /tmp/android-gpt-files.patch
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-manager
          git commit -m 'Fix Android ChatGPT file imports and cache manager'
          git push origin HEAD:main
