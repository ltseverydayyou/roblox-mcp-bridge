name: Repair decompiler patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch large files
        run: node scripts/repair-decompiler-patch.mjs

      - name: Commit repaired files if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connector.luau src/http/assets/dashboard/dashboard.js tests/upstream-ports.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Restore large files and apply decompiler fallback fix"
            git push
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
