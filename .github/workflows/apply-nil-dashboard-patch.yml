name: Apply nil dashboard patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          base64 -d .github/nil-dashboard.patch.gz.b64 | gzip -d > /tmp/nil-dashboard.patch
          git apply --check /tmp/nil-dashboard.patch
          git apply /tmp/nil-dashboard.patch
          rm -f .github/nil-dashboard.patch.gz.b64
          rm -f .github/workflows/apply-nil-dashboard-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add manual nil-instance dashboard explorer"
          git push
