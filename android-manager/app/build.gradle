plugins {
    id "com.android.application"
}

android {
    namespace "com.ltseverydayyou.robloxmcpmanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.ltseverydayyou.robloxmcpmanager"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.4.2"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/libtunnel-client.so"]
        }
    }
}

tasks.register("verifyEmbeddedRuntime") {
    doLast {
        def required = [
            file("src/main/jniLibs/arm64-v8a/libnode.so"),
            file("src/main/jniLibs/arm64-v8a/libc++_shared.so"),
            file("src/main/jniLibs/arm64-v8a/libtunnel-client.so"),
            file("src/main/cpp/node-include/node.h"),
            file("src/main/assets/nodejs-project/main.mjs"),
            file("src/main/assets/nodejs-project/connector.luau")
        ]
        def missing = required.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("Embedded runtime is not prepared. Run scripts/prepare-embedded-runtime.ps1 first. Missing: ${missing}")
        }
    }
}

preBuild.dependsOn verifyEmbeddedRuntime

tasks.register("packageManagerDebug", Copy) {
    dependsOn "assembleDebug"
    from layout.buildDirectory.file("outputs/apk/debug/app-debug.apk")
    into layout.buildDirectory.dir("distributions")
    rename { "RobloxMcpManager-Android-v${android.defaultConfig.versionName}-debug.apk" }
}
